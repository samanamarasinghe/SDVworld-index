<!doctype html>
<meta charset="utf-8">
<!-- Base is the repo root so the v1 runtime's relative fetches ('data/sdv-index.json',
     'data/tail/...') resolve exactly as they do on the real page. -->
<base href="/">
<title>v1 characterization oracle</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; margin: 2rem; }
  #harness-status { position: sticky; top: 0; background: #fff; padding: .5rem 0;
                    border-bottom: 1px solid #ccc; font-weight: 600; }
  #harness-log { white-space: pre-wrap; color: #444; }
  /* The v1 markup is injected below purely so init() finds its element ids. Nothing
     here reads the rendered output -- the oracle drives the exported closure. */
  #v1-markup { display: none; }
</style>
<div id="harness-status">starting…</div>
<div id="harness-log"></div>
<div id="v1-markup"></div>
<script type="module" src="/tests/oracle/driver.js"></script>
