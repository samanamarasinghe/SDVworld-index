<!doctype html>
<meta charset="utf-8">
<title>mobile-width render</title>
<style>
  body { font: 13px ui-monospace, monospace; margin: 0; background: #eef1f5; }
  #bar { padding: .5rem 1rem; background: #fff; border-bottom: 1px solid #ccc; }
  .frames { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-weight: 700; padding: .3rem 0; }
  /* A real 390px viewport. An iframe has its own viewport and media queries respond
     to it, so this is a genuine narrow render -- not a wide page scaled down, which
     is what resizing the browser window through the automation harness produced. */
  iframe { width: 390px; height: 1400px; border: 1px solid #999; background: #fff; }
</style>
<div id="bar"><span id="status">loading…</span></div>
<div class="frames">
  <figure><figcaption>v1 — 390px</figcaption><iframe id="f1" src="/index.html"></iframe></figure>
  <figure><figcaption>v2 — 390px</figcaption><iframe id="f2" src="/v2/index.html"></iframe></figure>
</div>
<script type="module">
const ready = async (id, name) => {
  const f = document.getElementById(id);
  for (let i = 0; i < 400; i++) {
    const d = f.contentDocument;
    if (d && /\(\d+\)/.test((d.getElementById('pubs-count')||{}).textContent||'')) return d;
    await new Promise(r => setTimeout(r, 250));
  }
  throw new Error(name + ' never loaded');
};
const d1 = await ready('f1','v1'), d2 = await ready('f2','v2');
await new Promise(r => setTimeout(r, 3000));
const w = (d) => d.defaultView.innerWidth;

/* The accessibility checks run here rather than in their own page: they need both
   documents side by side, and this harness already has them. */
const { run } = await import('/tests/parity/a11y.js');
const a11y = run(d1, d2);
const bad = a11y.filter(r => !r.ok);
window.__MOBILE__ = { ready: true, v1: w(d1), v2: w(d2), a11y, failed: bad.length };
document.getElementById('status').textContent =
  `v1 ${d1.getElementById('pubs-count').textContent} at ${w(d1)}px · ` +
  `v2 ${d2.getElementById('pubs-count').textContent} at ${w(d2)}px · ` +
  `a11y ${a11y.length - bad.length}/${a11y.length}` + (bad.length ? ' FAILING' : ' ok');
</script>
