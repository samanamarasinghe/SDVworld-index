<!doctype html>
<meta charset="utf-8">
<title>v1 / v2 stress</title>
<style>
  body { font: 13px/1.5 ui-monospace, monospace; margin: 0; }
  #bar { position: sticky; top: 0; background: #fff; padding: .6rem 1rem;
         border-bottom: 2px solid #333; z-index: 9; }
  #status { font-weight: 700; }
  #out { white-space: pre-wrap; padding: 0 1rem 2rem; }
  .frames { display: flex; height: 300px; }
  .frames iframe { flex: 1; border: 0; border-right: 1px solid #ccc; }
</style>
<div id="bar"><div id="status">starting…</div></div>
<div id="out"></div>
<!-- Both real pages, unmodified and unpatched. Nothing is instrumented here: the
     point of this harness is to compare what the two SHIPPED pages put on screen. -->
<div class="frames">
  <iframe id="f1"></iframe>
  <iframe id="f2"></iframe>
</div>
<script>
/* CACHE-BUST. Never test a page the browser kept from last time: serve.py once
   answered a conditional request with a 304 and Chrome ran an OLD harness through two
   full runs, reporting stale code as product failure. The frame src is set here, with
   a unique token, rather than written in the markup. */
const BUST = 'cb=' + Date.now() + '-' + Math.random().toString(36).slice(2);
document.getElementById('f1').src = '/v1/index.html?' + BUST;
document.getElementById('f2').src = '/index.html?' + BUST;
</script>
<script type="module" src="/tests/parity/stress.js"></script>
