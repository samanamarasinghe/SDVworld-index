name: build-index

# data/sdv-index.json is generated from data/shards/ by build.py, and the site reads
# it directly. Regenerating it by hand means every curation batch carries a large
# derived blob alongside the shards a reviewer actually wants to read, and the two
# drift the moment someone forgets. This rebuilds it instead.
#
# On a pull request: build and report if the committed output does not match the
# shards, without writing anything. On main: rebuild and commit if it changed, so the
# published site always matches the reviewed shards.
#
# "the committed output" is data/sdv-index.json and data/build-info.json. Covering
# only the first is what let the build stamp drift (design v2 §7).
#
# data/site/ is deliberately NOT rebuilt here -- it is verified instead. See the
# "Verify the site projection" step.

on:
  push:
    branches: [main]
    paths:
      - 'data/shards/**'
      - 'data/impact.json'
      - 'data/tail/**'
      - 'build.py'
      - 'site_projection.py'
      - 'VERSION'
      - '.github/workflows/build-index.yml'
  pull_request:
    paths:
      - 'data/shards/**'
      - 'data/impact.json'
      - 'data/tail/**'
      - 'build.py'
      - 'site_projection.py'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

env:
  # What CI regenerates and commits. data/site is NOT here on purpose -- see the
  # "Verify the site projection" step below.
  GENERATED: data/sdv-index.json data/build-info.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build index
        run: python build.py --write --no-site

      # The projection is VERIFIED here, not rebuilt. math.log1p is not correctly
      # rounded and libm differs by platform, so building this corpus on Linux and on
      # a developer's macOS gives 395 records whose popularity differs in the last
      # bit. Regenerating here would mean the bytes actually SERVED are CI's build,
      # which no differential has ever run against -- the tested build and the shipped
      # build would stop being the same thing. Rounding the score away is not
      # available: v1 inherits the same artifact and the golden corpus recorded the
      # ordering it produces. So the committed artifacts are authoritative and this
      # only checks they are still current.
      - name: Verify the site projection
        run: python scripts/verify_site.py

      - name: Build tests
        run: python tests/build_tests.py

      # Every path build.py --write can touch. The previous version checked and
      # committed only data/sdv-index.json, although the same command also rewrites
      # data/build-info.json -- so the stamp drifted and the live footer reported
      # v0.99 while VERSION said 1.0.0. Design v2 §7.
      - name: Check for drift (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- $GENERATED; then
            echo "::notice::generated output is stale; it will be rebuilt on merge."
            git diff --stat -- $GENERATED
          fi

      - name: Commit rebuilt output (main only)
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- $GENERATED; then
            echo "generated output already current, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged explicitly, path by path, so a new generated file cannot be
          # committed by accident and an existing one cannot be forgotten.
          git add data/sdv-index.json data/build-info.json
          git commit -m "Rebuild generated output from shards [skip ci]"
          git push
