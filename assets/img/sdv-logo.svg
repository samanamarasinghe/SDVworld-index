<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-label="The Synthetic Data Vault — Ecosystem Index">
  <defs>
    <linearGradient id="sdvTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a3b4"/>
      <stop offset="1" stop-color="#0b6d84"/>
    </linearGradient>
  </defs>

  <!-- Vault emblem -->
  <g transform="translate(20 20)">
    <rect x="0" y="0" width="140" height="140" rx="20" fill="url(#sdvTeal)"/>
    <rect x="12" y="12" width="116" height="116" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <!-- vault door -->
    <circle cx="70" cy="70" r="42" fill="none" stroke="#ffffff" stroke-width="7"/>
    <circle cx="70" cy="70" r="16" fill="#ffffff"/>
    <!-- spokes -->
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
      <line x1="70" y1="20" x2="70" y2="40"/>
      <line x1="70" y1="100" x2="70" y2="120"/>
      <line x1="20" y1="70" x2="40" y2="70"/>
      <line x1="100" y1="70" x2="120" y2="70"/>
      <line x1="34" y1="34" x2="48" y2="48"/>
      <line x1="92" y1="92" x2="106" y2="106"/>
      <line x1="106" y1="34" x2="92" y2="48"/>
      <line x1="48" y1="92" x2="34" y2="106"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(190 0)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="78" font-size="52" font-weight="700" fill="#16324f">The Synthetic Data Vault</text>
    <text x="2" y="120" font-size="27" font-weight="600" fill="#0b6d84" letter-spacing="0.5">Ecosystem Index</text>
    <text x="4" y="152" font-size="16" fill="#5a6b78">papers · code · docs · case studies across the SDV world</text>
  </g>
</svg>
